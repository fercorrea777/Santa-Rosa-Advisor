<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon del Advisor. Es el mismo LogoMark del sidebar (un velocimetro:
       arco + aguja + eje), no una marca nueva: el tablero ya tiene su simbolo
       y el favicon debe ser el mismo.

       Redibujado para 16 px, no escalado. A ese tamano el original pierde:
       - Se quita la linea de base (a 16 px queda a menos de 1 px y ensucia).
       - El trazo sube de 2 a 3.2 para que el arco no desaparezca.
       - El arco se abre menos (de 180 a ~150 grados) para ganar altura util.
       - Fondo propio: sin el, la marca cian desaparece sobre la barra clara
         del navegador.

       Colores tomados de globals.css, no inventados:
         fondo  = --card oscuro   oklch(0.215 0.024 252)  #1b242e
         acento = --primary       oklch(0.78 0.135 205)   #00cfe0  (9,2:1) -->
  <rect width="32" height="32" rx="7" fill="#1b242e"/>
  <g fill="none" stroke="#00cfe0" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 21.5a8.5 8.5 0 0 1 17 0"/>
    <path d="M16 21.5l5-5"/>
  </g>
  <circle cx="16" cy="21.5" r="2.4" fill="#00cfe0"/>
</svg>
